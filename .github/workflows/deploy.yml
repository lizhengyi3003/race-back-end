name: Deploy to Server

on:
  push:
    branches: [main]
    # 仅后端相关文件变化时触发部署（文档/无关改动不触发）
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'admin-web/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements*.txt'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          # 服务器侧该密钥被 command= 限制为只执行 /root/deploy-backend.sh
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            echo "GitHub Actions 已触发，受限密钥将自动执行 /root/deploy-backend.sh"

# dev 分支后端独立容器（与 main 环境并存）
# 端口 8081 → 容器 8000；复用 main 环境的 race-mysql（external network）
services:
  backend:
    build: .
    container_name: race-backend-dev
    restart: unless-stopped
    environment:
      # 通过 external 网络访问 main compose 的 mysql 服务
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:race123456@mysql:3306/race?charset=utf8mb4}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-me-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTO_TRAIN_ON_STARTUP: ${AUTO_TRAIN_ON_STARTUP:-false}
      SEED_SAMPLES: ${SEED_SAMPLES:-3000}
    ports:
      - "8081:8000"
    volumes:
      - model_data:/app/data/models
      - sample_data:/app/data/samples
    networks:
      - shared

volumes:
  model_data:
  sample_data:

networks:
  shared:
    external: true
    name: race-back-end_default
